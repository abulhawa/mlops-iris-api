name: mlops
services:
  mlops-iris-api:
    build: 
      dockerfile: src/api/Dockerfile
      context: .
    deploy:
      replicas: 3
    expose:
      - "8000"

  nginx:
    build:
      dockerfile: Dockerfile
      context: deployments/nginx/
    container_name: nginx_revproxy
    ports:
      - "8080:80"
    depends_on:
      mlops-iris-api:
        condition: service_started
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/nginx.conf:ro